<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Bank Kartları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f0ede4;
    --paper: #000000;
    --card: #141414;
    --gold: #e3a35c;
    --gold-soft: #242424;
    --line: rgba(240,237,228,0.12);
  }
  :root[data-theme="light"] {
    --ink: #1c1710;
    --paper: #faf6ee;
    --card: #ffffff;
    --gold: #c8863a;
    --gold-soft: #f0dcc0;
    --line: rgba(28,23,16,0.10);
  }

  * { box-sizing: border-box; }

  /* iOS avtomatik "telefon nömrəsi" linkini söndür (göy rəng + xətt) */
  a[href^="tel:"], a[x-apple-data-detectors] {
    color: inherit !important;
    text-decoration: none !important;
    font: inherit !important;
    letter-spacing: inherit !important;
    pointer-events: none;
  }

  html, body { height: 100%; background: var(--paper); }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { -webkit-appearance: none; appearance: none; }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 18px 48px;
    padding-top: calc(56px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  }

  .page {
    width: 100%;
    max-width: 440px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 46px;
    text-align: center;
    margin: 0 0 12px;
    letter-spacing: 0.28em;
    padding-left: 0.28em;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--gold) 0%, #f6d9a8 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(227,163,92,0.25));
  }

  h1::after {
    content: "";
    display: block;
    width: 180px;
    height: 2px;
    margin: 12px auto 0;
    background: var(--gold);
    border-radius: 2px;
    opacity: 0.7;
  }

  .sub {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    text-align: center;
    font-size: 14px;
    margin: 0 0 32px;
    line-height: 1.5;
  }
  .sub .sub-text { color: rgba(240,237,228,0.7); }
  .sub .sub-text strong { color: var(--ink); font-weight: 700; }
  .sub svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    color: var(--gold);
    filter: drop-shadow(0 0 6px rgba(227,163,92,0.35));
  }

  .lang-switch {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-bottom: 18px;
  }
  .lang-btn {
    font-family: inherit;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    opacity: 0.5;
    cursor: pointer;
    transition: opacity 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0;
  }
  .lang-btn svg { display: block; }
  .lang-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .lang-btn.active { opacity: 1; border-color: var(--gold); border-width: 2px; }

  .bank-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bank-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
  }

  .bank-head {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    text-decoration: none;
    text-align: left;
  }

  .bank-chevron {
    margin-left: auto;
    width: 16px;
    height: 16px;
    opacity: 0.45;
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .bank-card.open .bank-chevron {
    transform: rotate(180deg);
  }

  /* Yumşaq açılıb-bağlanan bölmə */
  .collapse {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.28s ease;
  }
  .bank-card.open .collapse {
    grid-template-rows: 1fr;
  }
  .collapse-inner {
    overflow: hidden;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    visibility: hidden;
    transition: visibility 0s linear 0.28s;
  }
  .bank-card.open .collapse-inner {
    visibility: visible;
    transition-delay: 0s;
  }
  .collapse-inner > :first-child {
    margin-top: 10px;
  }

  .option-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--gold);
    border-radius: 9px;
    padding: 8px 12px;
    color: var(--gold);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .option-link:hover { opacity: 0.85; transform: translateY(-1px); }
  .option-link svg { width: 16px; height: 16px; flex-shrink: 0; }

  .card-reveal > .mini-card { display: none; }
  .card-reveal.revealed > .mini-card { display: flex; animation: fadeUpIn 0.35s ease backwards; }
  .card-reveal.revealed > .reveal-btn { display: none; }
  .bank-card.open .collapse-inner > .mini-card { animation: fadeUpIn 0.4s ease 0.08s backwards; }

  .reveal-btn {
    width: 100%;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.35;
    text-align: center;
    color: var(--ink);
    background: var(--paper);
    border: 1px dashed var(--line);
    border-radius: 9px;
    padding: 9px 12px;
    cursor: pointer;
    opacity: 0.85;
    transition: border-color 0.15s ease, opacity 0.15s ease;
  }
  .reveal-btn:hover { border-color: var(--gold); opacity: 1; }

  .bank-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .bank-icon svg {
    width: 19px;
    height: 19px;
  }

  .bank-name {
    font-size: 15px;
    font-weight: 700;
  }

  /* Mini bank kartı */
  .mini-card {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 11px;
    padding: 12px 14px;
    border-radius: 12px;
    color: var(--fg, #fff);
    background: linear-gradient(135deg, var(--c1), var(--c2));
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 8px 20px -10px rgba(0,0,0,0.85);
  }
  .mini-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 88% -15%, rgba(255,255,255,0.30), transparent 55%);
    pointer-events: none;
  }
  .mc-top, .mc-bottom {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .mc-chip {
    position: relative;
    width: 26px;
    height: 19px;
    border-radius: 5px;
    background: linear-gradient(135deg, #f6dc9a, #c9953c);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
  }
  .mc-chip::before, .mc-chip::after {
    content: "";
    position: absolute;
    background: rgba(0,0,0,0.25);
  }
  .mc-chip::before { left: 0; right: 0; top: 50%; height: 1px; }
  .mc-chip::after  { top: 0; bottom: 0; left: 50%; width: 1px; }
  .mc-brand {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    opacity: 0.9;
  }
  .mc-number {
    position: relative;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1.4px;
    white-space: nowrap;
    text-shadow: 0 1px 0 rgba(0,0,0,0.25);
  }
  .mc-number::before { content: attr(data-display); }
  .mc-owner {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    opacity: 0.85;
  }
  .mini-card .copy-btn {
    background: var(--btn, rgba(255,255,255,0.2));
    color: var(--fg, #fff);
  }

  .copy-btn {
    flex-shrink: 0;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border: none;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .copy-btn:hover { opacity: 0.85; transform: translateY(-1px); }

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px);
    background: #07140c;
    color: #26d367;
    border: 1px solid rgba(38,211,103,0.5);
    text-shadow: 0 0 8px rgba(38,211,103,0.8), 0 0 18px rgba(38,211,103,0.35);
    font-size: 14px;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 999px;
    box-shadow: 0 0 22px -4px rgba(38,211,103,0.45), 0 10px 30px -8px rgba(0,0,0,0.8);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 100;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  footer {
    text-align: center;
    margin-top: 40px;
  }

  .powered-by {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--gold);
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .powered-by:hover { opacity: 0.85; transform: translateY(-1px); }
  .powered-by svg { width: 16px; height: 16px; }

  /* ===== Animasiyalar ===== */
  @keyframes fadeUpIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes titleShine {
    0%   { background-position: 100% 0; }
    60%  { background-position: 0% 0; }
    100% { background-position: 0% 0; }
  }
  @keyframes sweep {
    from { left: -60%; opacity: 1; }
    to   { left: 130%; opacity: 1; }
  }

  .lang-switch { animation: fadeUpIn 0.6s ease backwards; }

  h1 {
    background-image: linear-gradient(100deg, var(--gold) 0%, var(--gold) 42%, #fff1cf 50%, var(--gold) 58%, var(--gold) 100%);
    background-size: 250% 100%;
    background-position: 100% 0;
    animation: fadeUpIn 0.6s ease backwards, titleShine 5.5s ease-in-out 1.2s infinite;
  }
  .sub { animation: fadeUpIn 0.6s ease 0.12s backwards; }
  .bank-list > .bank-card { animation: fadeUpIn 0.6s ease backwards; }
  .bank-list > .bank-card:nth-child(1) { animation-delay: 0.24s; }
  .bank-list > .bank-card:nth-child(2) { animation-delay: 0.34s; }
  .bank-list > .bank-card:nth-child(3) { animation-delay: 0.44s; }
  .bank-list > .bank-card:nth-child(4) { animation-delay: 0.54s; }
  .bank-list > .bank-card:nth-child(5) { animation-delay: 0.64s; }
  footer { animation: fadeUpIn 0.6s ease 0.8s backwards; }

  /* Toxunuş effekti: basılanda sətir yüngül sıxılır, üzərindən qızılı işıq keçir */
  .bank-card {
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease;
  }
  .bank-card.pressed { transform: scale(0.985); }
  .bank-card::after {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(100deg, transparent 0%, rgba(227,163,92,0.28) 50%, transparent 100%);
    transform: skewX(-18deg);
    opacity: 0;
    pointer-events: none;
  }
  .bank-card.shine::after { animation: sweep 0.65s ease-out; }

  @media (prefers-reduced-motion: reduce) {
    .lang-switch, h1, .sub, .bank-list > .bank-card, footer { animation: none !important; }
    .bank-card.open .collapse-inner > .mini-card,
    .card-reveal.revealed > .mini-card { animation: none !important; }
    .bank-card::after { display: none; }
  }
</style>
</head>

        <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="collapse"><div class="collapse-inner">
            <div class="mini-card" style="--c1:#303030; --c2:#0A0A0A; --fg:#fff; --btn:rgba(255,255,255,0.2);">
              <div class="mc-top"><span class="mc-chip"></span><span class="mc-brand">LEOBANK</span></div>
              <span class="mc-number" id="card-leo" data-copy="4098584498187283" data-display="4098 5844 9818 7283"></span>
              <div class="mc-bottom"><span class="mc-owner">KAMRAN GULAHMADOV</span><button type="button" class="copy-btn" onclick="copyCard('card-leo', this)" data-i18n="copy">Kopyala</button></div>
            </div>
        </div></div>
      </div>

      <!-- Unibank -->
      <div class="bank-card">
        <button type="button" class="bank-head" onclick="toggleBank(this)">
          <div class="bank-icon" style="background:#F2B705;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#1c1710" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2.5"/>
              <path d="M2 9.5h20"/>
              <path d="M5.5 14.5h4"/>
            </svg>
          </div>
          <span class="bank-name">Unibank</span>
        <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="collapse"><div class="collapse-inner">
            <div class="mini-card" style="--c1:#FFCB2E; --c2:#C98F00; --fg:#1c1710; --btn:rgba(0,0,0,0.14);">
              <div class="mc-top"><span class="mc-chip"></span><span class="mc-brand">UNIBANK</span></div>
              <span class="mc-number" id="card-uni" data-copy="5243754440885620" data-display="5243 7544 4088 5620"></span>
              <div class="mc-bottom"><span class="mc-owner">KAMRAN GULAHMADOV</span><button type="button" class="copy-btn" onclick="copyCard('card-uni', this)" data-i18n="copy">Kopyala</button></div>
            </div>
        </div></div>
      </div>

    </div>

    <!--

      <a class="powered-by" href="https://www.instagram.com/startap.aze?stkn=MWNqbm81aDlzOXM4MA==" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5"/>

  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // ===== Tətbiqi açmaq (yalnız Android) =====
    // Android paket adı ilə açmağa cəhd edir. Tətbiq açılmasa, Google Play səhifəsi açılır.
    var IS_ANDROID = /Android/i.test(navigator.userAgent);
    var APP_LINKS = {
      leo: 'intent://#Intent;package=com.ftfarm.leo;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.ftfarm.leo;end',
      uni: ''
    };

    function openApp(key) {
      var link = APP_LINKS[key];
      if (link && IS_ANDROID) setTimeout(function () { window.location.href = link; }, 350);
    }

    // Sətrə basanda: bölmə açılır, nömrə avtomatik kopyalanır, tətbiq açılmağa çalışır
    function bankTap(btn, id, key) {
      var card = btn.closest('.bank-card');
      var opening = !card.classList.contains('open');
      toggleBank(btn);
      if (!opening) return;
      copyCard(id, btn, function () { openApp(key); });
    }

    function toggleBank(btn) {
      var card = btn.closest('.bank-card');
      card.classList.toggle('open');
    }

    function revealCard(btn) {
      btn.closest('.card-reveal').classList.add('revealed');
    }

    // ===== Dillər: mətnləri burada dəyişə bilərsən =====
    var translations = {
      az: {
        page_title: 'Bank Kartları',
        trust_pre: 'Bu kart məlumatları ',
        trust_post: '-a məxsusdur!',
        reveal: 'Digər bank kartından ödəniş etmək üçün toxun',
        abb_pay: 'ABB Mobile ilə ödə',
        birbank_pay: 'Birbank tətbiqi ilə ödə',
        copy: 'Kopyala',
        copied: 'Uğurla kopyalandı ✓',
        copy_failed: 'Kopyalamaq alınmadı'
      },
      ru: {
        page_title: 'Банковские карты',
        trust_pre: 'Эти данные карт принадлежат ',
        trust_post: '!',
        reveal: 'Нажмите, чтобы оплатить с карты другого банка',
        abb_pay: 'Оплатить через ABB Mobile',
        birbank_pay: 'Оплатить через приложение Birbank',
        copy: 'Копировать',
        copied: 'Успешно скопировано ✓',
        copy_failed: 'Не удалось скопировать'
      },
      en: {
        page_title: 'Bank Cards',
        trust_pre: 'These card details belong to ',
        trust_post: '!',
        reveal: "Tap to pay from another bank's card",
        abb_pay: 'Pay with ABB Mobile',
        birbank_pay: 'Pay with the Birbank app',
        copy: 'Copy',
        copied: 'Copied successfully ✓',
        copy_failed: 'Copy failed'
      }
    };
    var currentLang = 'az';

    function t(key) { return translations[currentLang][key]; }

    function setLang(lang) {
      var dict = translations[lang];
      if (!dict) return;
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var v = dict[el.getAttribute('data-i18n')];
        if (v) el.textContent = v;
      });
      document.querySelectorAll('.lang-btn').forEach(function (btn) {
        var on = btn.getAttribute('data-lang') === lang;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      document.title = dict.page_title;
      document.documentElement.lang = lang;
      try { localStorage.setItem('preferredLang', lang); } catch (e) {}
    }

    var toastTimer;
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2000);
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      ta.style.fontSize = '16px';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      return ok;
    }

    function copyCard(id, btn, onSuccess) {
      var el = document.getElementById(id);
      var text = (el.getAttribute('data-copy') || el.textContent).trim();
      function done(ok) {
        if (!ok) { showToast(t('copy_failed')); return; }
        showToast(t('copied'));
        if (onSuccess) onSuccess();
        // ABB və Birbank: kopyalandıqdan sonra bölmə bağlanır, yalnız bank sətri qalır
        var reveal = btn.closest('.card-reveal');
        if (reveal) {
          var card = btn.closest('.bank-card');
          if (card) card.classList.remove('open');
          // bölmə bağlanandan sonra nömrə yenidən gizlənir
          setTimeout(function () { reveal.classList.remove('revealed'); }, 320);
        }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { done(true); },
          function () { done(fallbackCopy(text)); }
        );
      } else {
        done(fallbackCopy(text));
      }
    }

    // Toxunuş effekti: sətir sıxılır + qızılı işıq zolağı keçir
    document.querySelectorAll('.bank-head').forEach(function (head) {
      var card = head.closest('.bank-card');
      head.addEventListener('pointerdown', function () {
        card.classList.add('pressed');
        card.classList.remove('shine');
        void card.offsetWidth;
        card.classList.add('shine');
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) {
        head.addEventListener(ev, function () { card.classList.remove('pressed'); });
      });
    });
    document.querySelectorAll('.bank-card').forEach(function (card) {
      card.addEventListener('animationend', function (e) {
        if (e.animationName === 'sweep') card.classList.remove('shine');
      });
    });

    try {
      var savedLang = localStorage.getItem('preferredLang');
      if (savedLang && translations[savedLang] && savedLang !== 'az') setLang(savedLang);
    } catch (e) {}
  </script>
