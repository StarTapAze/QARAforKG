<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bank Kartları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f0ede4;
    --paper: #000000;
    --card: #141414;
    --gold: #e3a35c;
    --gold-soft: #242424;
    --line: rgba(240,237,228,0.12);
  }
  :root[data-theme="light"] {
    --ink: #1c1710;
    --paper: #faf6ee;
    --card: #ffffff;
    --gold: #c8863a;
    --gold-soft: #f0dcc0;
    --line: rgba(28,23,16,0.10);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; background: var(--paper); }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 18px 48px;
    padding-top: calc(56px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  }

  .page {
    width: 100%;
    max-width: 440px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 27px;
    text-align: center;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .sub {
    text-align: center;
    font-size: 14px;
    opacity: 0.6;
    margin: 0 0 32px;
    line-height: 1.5;
  }

  .bank-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bank-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bank-head {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    text-decoration: none;
    text-align: left;
  }

  .bank-chevron {
    margin-left: auto;
    width: 18px;
    height: 18px;
    opacity: 0.5;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .bank-card.open .bank-chevron {
    transform: rotate(180deg);
  }

  .card-number-row {
    display: none;
  }
  .bank-card.open .card-number-row {
    display: flex;
  }

  .bank-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .bank-icon svg {
    width: 22px;
    height: 22px;
  }

  .bank-name {
    font-size: 16px;
    font-weight: 700;
  }

  .card-number-row {
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
  }

  .card-number {
    font-family: 'Courier New', monospace;
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 0.5px;
    word-break: break-all;
  }

  .copy-btn {
    flex-shrink: 0;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border: none;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .copy-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .copy-btn.copied { color: #4caf50; }

  footer {
    text-align: center;
    margin-top: 40px;
  }

  .powered-by {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--gold);
  }
  .powered-by svg { width: 16px; height: 16px; }
</style>
</head>
<body>
  <div class="page">

    <!--
      ══════════════════════════════════════════
      REDAKTƏ BURADAN BAŞLAYIR
      Hər kartın nömrəsini (XXXX XXXX XXXX XXXX yazan yeri)
      öz həqiqi kart nömrənlə dəyiş.
      ══════════════════════════════════════════
    -->

    <h1>QARA</h1>
    <p class="sub">Qaraya girən ölməlidi!</p>

    <div class="bank-list">

      <!-- ABB -->
      <div class="bank-card">
        <button type="button" class="bank-head" onclick="toggleBank(this)">
          <div class="bank-icon" style="background:#1565C0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2.5"/>
              <path d="M2 9.5h20"/>
              <path d="M5.5 14.5h4"/>
            </svg>
          </div>
          <span class="bank-name">ABB</span>
        <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="card-number-row">
          <span class="card-number" id="card-abb">XXXX XXXX XXXX XXXX</span>
          <button type="button" class="copy-btn" onclick="copyCard('card-abb', this)">Kopyala</button>
        </div>
      </div>

      <!-- Kapital Bank / Birbank -->
      <div class="bank-card">
        <a class="bank-head" href="https://app.birbank.az/qp?t=2&id=250D5E3FA1EE2FC8E0630100007FDB72" target="_blank" rel="noopener">
          <div class="bank-icon" style="background:#D32F2F;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2.5"/>
              <path d="M2 9.5h20"/>
              <path d="M5.5 14.5h4"/>
            </svg>
          </div>
          <span class="bank-name">Kapital Bank (Birbank)</span>
          <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform:rotate(-90deg);"><path d="M6 9l6 6 6-6"/></svg>
        </a>
      </div>

      <!-- Rabitəbank -->
      <div class="bank-card">
        <button type="button" class="bank-head" onclick="toggleBank(this)">
          <div class="bank-icon" style="background:#2E7D32;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2.5"/>
              <path d="M2 9.5h20"/>
              <path d="M5.5 14.5h4"/>
            </svg>
          </div>
          <span class="bank-name">Rabitəbank</span>
        <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="card-number-row">
          <span class="card-number" id="card-rabite">XXXX XXXX XXXX XXXX</span>
          <button type="button" class="copy-btn" onclick="copyCard('card-rabite', this)">Kopyala</button>
        </div>
      </div>

      <!-- Leobank -->
      <div class="bank-card">
        <button type="button" class="bank-head" onclick="toggleBank(this)">
          <div class="bank-icon" style="background:#111111;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2.5"/>
              <path d="M2 9.5h20"/>
              <path d="M5.5 14.5h4"/>
            </svg>
          </div>
          <span class="bank-name">Leobank</span>
        <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="card-number-row">
          <span class="card-number" id="card-leo">XXXX XXXX XXXX XXXX</span>
          <button type="button" class="copy-btn" onclick="copyCard('card-leo', this)">Kopyala</button>
        </div>
      </div>

      <!-- Unibank -->
      <div class="bank-card">
        <button type="button" class="bank-head" onclick="toggleBank(this)">
          <div class="bank-icon" style="background:#F2B705;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#1c1710" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2.5"/>
              <path d="M2 9.5h20"/>
              <path d="M5.5 14.5h4"/>
            </svg>
          </div>
          <span class="bank-name">Unibank</span>
        <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="card-number-row">
          <span class="card-number" id="card-uni">XXXX XXXX XXXX XXXX</span>
          <button type="button" class="copy-btn" onclick="copyCard('card-uni', this)">Kopyala</button>
        </div>
      </div>

      <!-- M10 -->
      <div class="bank-card">
        <button type="button" class="bank-head" onclick="toggleBank(this)">
          <div class="bank-icon" style="background:#17A398;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2.5"/>
              <path d="M2 9.5h20"/>
              <path d="M5.5 14.5h4"/>
            </svg>
          </div>
          <span class="bank-name">M10</span>
        <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="card-number-row">
          <span class="card-number" id="card-m10">+994555103010</span>
          <button type="button" class="copy-btn" onclick="copyCard('card-m10', this)">Kopyala</button>
        </div>
      </div>

    </div>

    <!--
      ══════════════════════════════════════════
      REDAKTƏ BURADA BİTİR
      ══════════════════════════════════════════
    -->

    <footer>
      <div class="powered-by">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1"/>
        </svg>
        <span>Powered by StarTap.Aze</span>
      </div>
    </footer>
  </div>

  <script>
    function toggleBank(btn) {
      var card = btn.closest('.bank-card');
      card.classList.toggle('open');
    }

    function copyCard(id, btn) {
      var text = document.getElementById(id).textContent.trim();
      navigator.clipboard.writeText(text).then(function () {
        var original = btn.textContent;
        btn.textContent = 'Kopyalandı ✓';
        btn.classList.add('copied');
        setTimeout(function () {
          btn.textContent = original;
          btn.classList.remove('copied');
        }, 1500);
      }).catch(function () {});
    }
  </script>
</body>
</html>
